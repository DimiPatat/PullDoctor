name: Scheduled PullDoctor Report

on:
  schedule:
    # Mon & Wed ~23:15 Brussels time.
    # CET (winter, UTC+1) -> 22:15 UTC
    - cron: '15 22 * * 1,3'
    # CEST (summer, UTC+2) -> 21:15 UTC
    - cron: '15 21 * * 1,3'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the schedule-window check'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automation
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python automation.py --force
          else
            python automation.py
          fi

      - name: Commit and push generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Publish scheduled raid report [skip ci]"
          git push