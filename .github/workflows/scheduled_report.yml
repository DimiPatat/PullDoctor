# .github/workflows/scheduled_report.yml
#
# Runs publish_scheduled_report.py on a schedule and publishes the
# result to GitHub Pages (served from the docs/ folder in this repo).
#
# ----------------------------------------------------------------------
# WHY TWO "cron:" LINES, AND WHY THE MONTHS SPLIT WHERE THEY DO
# ----------------------------------------------------------------------
# GitHub Actions cron ALWAYS runs in UTC -- there is no timezone option.
# Brussels is UTC+1 (CET) in winter and UTC+2 (CEST) in summer, switching
# on the last Sunday of March and the last Sunday of October. To target
# "23:15 Brussels time", two separate cron lines are needed:
#
#   CET months (UTC+1): 23:15 CET = 22:15 UTC -> "15 22 * * 1,3"
#   CEST months (UTC+2): 23:15 CEST = 21:15 UTC -> "15 21 * * 1,3"
#
# Since the exact switchover date moves around within March/October each
# year, and cron can only restrict by whole months (not "after the last
# Sunday of this month"), the month ranges below are a practical
# approximation:
#   - Nov-Mar treated as CET  (November/December/January/February are
#     ALWAYS fully CET; March is CET for all but its last few days)
#   - Apr-Oct treated as CEST (April-September are ALWAYS fully CEST;
#     October is CEST for all but its last few days)
#
# This means for roughly the LAST WEEK of March and the LAST WEEK of
# October, this cron schedule alone would be off by up to an hour.
# THIS IS HANDLED CORRECTLY REGARDLESS: publish_scheduled_report.py
# calls schedule_guard.py, which checks the REAL current Brussels time
# (via Python's zoneinfo, which has its own always-correct DST rules --
# no month-bucketing involved) and only lets the report actually
# generate if it's genuinely the right day and within 30 minutes of
# 23:15 Brussels time. So the cron below only needs to be an
# approximately-right TRIGGER; the guard is what guarantees correctness.
# See test_schedule_guard.py for tests proving this against the real
# 2026 DST transition dates.
# ----------------------------------------------------------------------

name: Scheduled Raid Report

on:
  schedule:
    # Winter (CET, UTC+1): Mon & Wed at 23:15 Brussels time -> 22:15 UTC
    - cron: "15 22 1-31 11,12,1,2,3 1,3"
    # Summer (CEST, UTC+2): Mon & Wed at 23:15 Brussels time -> 21:15 UTC
    - cron: "15 21 1-31 4,5,6,7,8,9,10 1,3"
  workflow_dispatch: {}  # lets you click "Run workflow" manually in the Actions tab, any time

permissions:
  contents: write   # needed to commit the generated report/index back into docs/
  pages: write       # needed to deploy to GitHub Pages
  id-token: write    # required by actions/deploy-pages

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate the latest guild report
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          # No --force here: a schedule-triggered run must still pass
          # schedule_guard.py's real-time check. A workflow_dispatch
          # (manual) run passes --force instead, via the step below.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python publish_scheduled_report.py --force
          else
            python publish_scheduled_report.py
          fi

      - name: Commit generated report back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit (schedule guard likely skipped this run)."
          else
            git commit -m "Publish scheduled raid report"
            # Fetch + rebase immediately before pushing, in case main moved
            # forward (e.g. a manual push, or another run) since this job's
            # checkout -- avoids a rejected non-fast-forward push.
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
